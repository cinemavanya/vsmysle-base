:root {
  --desk: #aac3cb; --desk-shadow: #8ea9b3; --paper: #fbf6e9; --cream: #f5edcf; --surface: #dde5e3;
  --ink: #192d3b; --muted: #3b5361; --line: #738e99; --crimson: #a9303e; --scarlet: #ef493e;
  --pink: #ff9fce; --yellow: #f7cf4a;
  --f-display: "Roboto Condensed", Impact, sans-serif; --f-body: "Golos Text", system-ui, sans-serif; --f-hand: "Shantell Sans", cursive;
  --r: 14px 18px 12px 16px / 16px 12px 18px 14px;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--desk); color: var(--ink); font: 400 16.5px/1.55 var(--f-body); }
main { max-width: 820px; margin: 0 auto; padding: 28px 16px 70px; }
.top { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
.top img { height: 26px; transform: rotate(-3deg); filter: drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff); }
.top b { font: 800 18px/1 var(--f-display); text-transform: uppercase; }
.sheet { background: var(--paper); border: 3px solid var(--ink); border-radius: 24px 10px 20px 12px / 14px 22px 12px 24px; box-shadow: 8px 9px 0 var(--desk-shadow); padding: 30px 30px 34px; }
h1 { margin: 0 0 6px; font: 800 clamp(30px, 6vw, 44px)/1 var(--f-display); text-transform: uppercase; }
.sub { margin: 0 0 22px; font: 400 18px/1.35 var(--f-hand); color: var(--crimson); }
.ch { margin: 18px 0 0; padding: 16px 18px; border: 2.5px solid var(--ink); border-radius: var(--r); background: #fff; }
.ch h2 { margin: 0 0 10px; font: 800 20px/1.1 var(--f-display); text-transform: uppercase; }
.ch h2 span { color: var(--scarlet); margin-right: 6px; }
.item { padding: 9px 0; border-top: 1.5px dashed var(--line); }
.item:first-of-type { border-top: 0; padding-top: 2px; }
.tag { display: inline-block; margin-right: 8px; padding: 1px 8px; border: 1.5px solid var(--ink); border-radius: 999px; font: 700 11px/1.4 var(--f-body); letter-spacing: .06em; text-transform: uppercase; vertical-align: 1px; }
.tag--new { background: var(--yellow); } .tag--live { background: var(--pink); } .tag--qa { background: var(--surface); } .tag--fix { background: var(--cream); }
.date { font: 400 15px/1 var(--f-hand); color: var(--muted); }
.item p { margin: 4px 0 0; }
.rec { display: inline-block; margin: 0 0 10px; font-weight: 650; color: var(--ink); text-decoration-color: var(--scarlet); text-decoration-thickness: 2px; text-underline-offset: 3px; }
.lock p { margin: 0 0 10px; color: var(--muted); }
.lock form { display: flex; flex-wrap: wrap; gap: 8px; }
.lock input { flex: 1 1 180px; min-width: 0; padding: 9px 14px; border: 2.5px solid var(--ink); border-radius: 999px; font: 600 16px/1.2 var(--f-body); }
.lock button { padding: 9px 18px; border: 2.5px solid var(--ink); border-radius: 999px; background: var(--ink); color: var(--cream); font: 600 15px/1.1 var(--f-body); cursor: pointer; }
.msg { margin: 8px 0 0; font: 400 16px/1.3 var(--f-hand); color: var(--crimson); }
.empty { font: 400 18px/1.4 var(--f-hand); color: var(--muted); }
@media (max-width: 560px) { .sheet { padding: 22px 16px 26px; } }
</style>

  <div class="sheet">
    <h1>Живая база курса</h1>
    <p class="sub" id="sub">Что поменялось и что попробовали на встречах. Главы открываются теми же словами, что в Блокноте.</p>
    <div id="list"><p class="empty">Загружаю…</p></div>
  </div>
</main>
<script>
(() => {
  "use strict";
  const CID = "vsmysle-pilot";
  const KINDS = { new: "в приложении", live: "попробовали вживую", qa: "вопрос со встречи", fix: "поправка к тезису" };
  const enc = new TextEncoder(), dec = new TextDecoder();
  const norm = w => String(w || "").trim().toLowerCase().replace(/ё/g, "е");
  const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const h = (tag, attrs, ...kids) => { const el = document.createElement(tag); for (const [k, v] of Object.entries(attrs || {})) { if (v == null) continue; if (k === "class") el.className = v; else if (k === "text") el.textContent = v; else el.setAttribute(k, v); } for (const x of kids.flat()) if (x != null) el.append(x); return el; };
  const rich = t => String(t).split(/(\*\*[^*]+\*\*)/g).map(p => /^\*\*[^*]+\*\*$/.test(p) ? h("b", { text: p.slice(2, -2) }) : document.createTextNode(p));
  const fmtDate = iso => { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleDateString("ru-RU", { day: "numeric", month: "long" }); };
  async function key(n, word) {
    const base = await crypto.subtle.importKey("raw", enc.encode(norm(word)), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name: "PBKDF2", salt: enc.encode(`vsmysle:${CID}:${n}`), iterations: 150000, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  }
  async function open(n, word, box) {
    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(box.iv) }, await key(n, word), unb64(box.data));
    return JSON.parse(dec.decode(pt));
  }
  // слова: из ссылки Блокнота (#w=…) и запомненные на этой странице
  let words = {};
  try { words = JSON.parse(localStorage.getItem("vsmysle-base-words") || "{}"); } catch (e) {}
  const m = location.hash.match(/[#&]w=([^&]+)/);
  if (m) { try { Object.assign(words, JSON.parse(decodeURIComponent(m[1]))); } catch (e) {} history.replaceState(null, "", location.pathname); }
  const saveWords = () => { try { localStorage.setItem("vsmysle-base-words", JSON.stringify(words)); } catch (e) {} };

  function body(c) {
    const out = [];
    const url = c.recording?.url;
    if (typeof url === "string" && /^https:\/\//.test(url)) out.push(h("a", { class: "rec", href: url, target: "_blank", rel: "noopener", text: `▶ ${c.recording.title || "Запись встречи"}${c.recording.length ? " · " + c.recording.length : ""}` }));
    for (const x of (c.items || []).filter(x => KINDS[x.kind] && typeof x.text === "string"))
      out.push(h("div", { class: "item" }, h("span", { class: `tag tag--${x.kind}`, text: KINDS[x.kind] }), x.date ? h("span", { class: "date", text: fmtDate(x.date) }) : null, h("p", {}, rich(x.text))));
    if (!out.length) out.push(h("p", { class: "empty", text: "Пока пусто." }));
    return out;
  }
  function lockForm(n, box, card) {
    const inp = h("input", { type: "text", placeholder: "слово", autocomplete: "off", "aria-label": `Слово к главе ${n}` });
    const btn = h("button", { type: "submit", text: "Открыть" });
    const msg = h("p", { class: "msg" });
    const form = h("form", {}, inp, btn);
    form.addEventListener("submit", async e => {
      e.preventDefault(); msg.textContent = "";
      try { const c = await open(n, inp.value, box); words[n] = norm(inp.value); saveWords(); card.replaceChildren(card.firstChild, ...body(c)); }
      catch (err) { msg.textContent = "Не то слово — оно то же, что открывает главу в Блокноте."; }
    });
    return h("div", { class: "lock" }, h("p", { text: "Глава закрыта. Открой её словом из Блокнота." }), form, msg);
  }
  async function render(data) {
    const list = document.getElementById("list");
    const nums = Object.keys(data.chapters || {}).sort((a, b) => a - b);
    if (data.updated) document.getElementById("sub").textContent = `Обновлено ${fmtDate(data.updated)}. Главы открываются теми же словами, что в Блокноте.`;
    if (!nums.length) { list.replaceChildren(h("p", { class: "empty", text: "Здесь появятся заметки после первой встречи." })); return; }
    const cards = [];
    for (const n of nums) {
      const c = data.chapters[n];
      const card = h("section", { class: "ch" }, h("h2", {}, h("span", { text: n }), data.titles?.[n] || `Глава ${n}`));
      if (c.lock) {
        let opened = null;
        if (words[n]) { try { opened = await open(n, words[n], c.lock); } catch (e) { delete words[n]; } }
        card.append(...(opened ? body(opened) : [lockForm(n, c.lock, card)]));
      } else card.append(...body(c));
      cards.push(card);
    }
    saveWords();
    list.replaceChildren(...cards);
  }
  fetch("base.json?t=" + Date.now(), { cache: "no-store" }).then(r => r.json()).then(render)
    .catch(() => document.getElementById("list").replaceChildren(h("p", { class: "empty", text: "Не получилось загрузить базу. Проверь интернет и обнови страницу." })));
})();
</script>
</body>
</html>
